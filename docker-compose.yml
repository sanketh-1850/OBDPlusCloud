version: "3.9"

services:
  ai-service:
    build:
      context: ./ai-service
    container_name: obd-ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env
    restart: unless-stopped

  api-service:
    build:
      context: ./api-service
    container_name: obd-api-service
    ports:
      - "8000:8000"
    env_file:
      - ./api-service/.env
    depends_on:
      - ai-service
    restart: unless-stopped
